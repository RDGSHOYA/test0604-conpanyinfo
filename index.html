<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>営業訪問前レポート</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f1ec;color:#1f2937;font-family:"Noto Sans JP","Yu Gothic",system-ui,sans-serif}.page{width:min(1040px,calc(100% - 32px));margin:auto;padding:32px 0 56px}.panel,.report{background:#fff;border:1px solid #e2ddd5;border-radius:8px;box-shadow:0 18px 44px rgba(15,23,42,.07);padding:24px}.hero{margin-bottom:20px}.eyebrow{margin:0 0 8px;color:#0f766e;font-weight:700;font-size:14px}h1{margin:0;color:#0f172a;font-size:clamp(30px,4vw,44px);letter-spacing:0;line-height:1.12}h2,h3,h4{margin:0;color:#0f172a;letter-spacing:0}.muted{color:#64748b;line-height:1.7}.hero .muted{max-width:720px}.grid{display:grid;gap:20px}.form{display:grid;gap:16px;margin-top:20px}label{display:block;font-weight:700;font-size:14px;color:#334155}input{width:100%;min-height:46px;margin-top:8px;border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;font:inherit}input:focus{outline:0;border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.14)}.error{display:none;margin:6px 0 0;color:#b42318;font-size:13px}.invalid input{border-color:#ef8b82}.invalid .error{display:block}.actions{display:flex;gap:12px;flex-wrap:wrap}.btn{min-height:44px;border-radius:6px;border:1px solid transparent;padding:10px 18px;font-weight:700;cursor:pointer}.primary{background:#0f766e;color:#fff}.primary:hover{background:#115e59}.secondary{background:#fff;color:#334155;border-color:#cbd5e1}.secondary:hover{background:#f8fafc}.empty{text-align:center;border-style:dashed}.empty[hidden],.report[hidden]{display:none}.badge{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 12px;border-radius:8px;background:#ccfbf1;color:#0f766e;font-size:24px;font-weight:800}.report-head{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid #e2e8f0;padding-bottom:22px}.report-title{font-size:clamp(24px,3vw,34px)}.section{border-top:1px solid #e2e8f0;margin-top:24px;padding-top:24px}.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.info div,.hypothesis,.check li{border:1px solid #e2e8f0;border-radius:6px;background:#f8fafc;padding:12px}.info dt{color:#64748b;font-size:12px;font-weight:700}.info dd{margin:4px 0 0;font-weight:700;overflow-wrap:anywhere}ul{list-style:none;margin:14px 0 0;padding:0}li{position:relative;margin-top:10px;padding-left:18px;line-height:1.75;color:#334155}li:before{content:"";position:absolute;left:0;top:.82em;width:6px;height:6px;border-radius:50%;background:#0f766e}.hypotheses{display:grid;gap:14px;margin-top:14px}.hypothesis{background:#fff}.num{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:8px;border-radius:6px;background:#ccfbf1;color:#0f766e;font-weight:800}.hypothesis dl{margin:12px 0 0}.hypothesis dt{margin-top:10px;font-weight:800}.hypothesis dd{margin:4px 0 0;color:#475569;line-height:1.7}.check{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.check li{margin:0;padding-left:34px}.check li:before{content:"✓";top:10px;left:12px;width:auto;height:auto;background:transparent;color:#0f766e;font-weight:800}.status{min-height:20px;margin-top:10px;color:#0f766e;font-weight:700;font-size:14px}@media(max-width:720px){.page{width:min(100% - 20px,1040px);padding:18px 0 36px}.panel,.report{padding:18px}.report-head,.actions{flex-direction:column}.btn{width:100%}.info,.check{grid-template-columns:1fr}}@media print{body{background:#fff}.no-print,.empty,.hero,.panel{display:none!important}.page{width:100%;padding:0}.report{box-shadow:none;border-color:#cbd5e1}}
  </style>
</head>
<body>
  <main class="page">
    <section class="panel hero">
      <p class="eyebrow">法人営業向け</p>
      <h1>営業訪問前レポート</h1>
      <p class="muted">新規顧客への訪問前に、企業概要・想定課題・提案仮説を整理します。</p>
    </section>
    <div class="grid">
      <section class="panel no-print">
        <h2>訪問予定の情報</h2>
        <p class="muted">3つの入力項目から、上司レビューに使える訪問前レポートを作成します。</p>
        <form id="form" class="form" novalidate>
          <div class="field" data-field="company"><label for="company">お客様企業名</label><input id="company" placeholder="例: 株式会社サンプル" autocomplete="organization"><p class="error">お客様企業名を入力してください。</p></div>
          <div class="field" data-field="contact"><label for="contact">担当者名</label><input id="contact" placeholder="例: 山田 太郎" autocomplete="name"><p class="error">担当者名を入力してください。</p></div>
          <div class="field" data-field="dept"><label for="dept">担当者の部署名</label><input id="dept" placeholder="例: 情報システム部"><p class="error">担当者の部署名を入力してください。</p></div>
          <div class="actions"><button class="btn primary" type="submit">レポートを作成</button><button class="btn secondary" id="reset" type="button">入力をリセット</button></div>
        </form>
      </section>
      <section class="panel empty" id="empty"><div class="badge">R</div><h2>レポートはまだ作成されていません</h2><p class="muted">入力後に、企業概要、想定課題、提案仮説、確認質問、次のアクションが表示されます。</p></section>
      <article class="report" id="report" hidden></article>
    </div>
  </main>
  <script>
    const data={
      info:{keys:["情報システム","情シス","it","システム","デジタル"],label:"情報システム部門",issues:["既存システムの運用負荷が高く、改善活動に時間を割きにくい可能性がある","セキュリティ対策や権限管理の見直しが継続課題になっている可能性がある","部門ごとにツールが分断され、情報連携やデータ活用に手間が出ている可能性がある","問い合わせ対応や定型作業が属人化し、担当者の負荷が偏っている可能性がある"],hypos:[["運用負荷を下げる業務標準化","問い合わせ対応や保守作業に時間を取られ、改善テーマが後回しになりやすい。","申請・対応・記録の流れを見える化し、運用負荷の削減余地を確認する。","問い合わせ対応や申請処理で特に時間がかかっている業務はどれですか。"],["セキュリティと利便性の両立","利便性を保ちながら統制を強める必要があり、現場運用とのバランスが課題になりやすい。","権限管理、ログ確認、承認フローを確認し、統制強化と負荷削減を同時に検討する。","セキュリティ強化で優先度が高い領域はどこですか。"],["既存ツールの分断解消","複数ツールの併用により情報が分散し、確認や転記の手間が増えやすい。","既存ツールの利用状況を整理し、連携・集約・運用ルール整備の余地を探る。","二重入力や情報共有しにくいデータはありますか。"]]},
      hr:{keys:["人事","hr","採用","労務"],label:"人事部門",issues:["採用、育成、定着の情報が分断されている可能性がある","評価制度や面談記録の運用にばらつきが出ている可能性がある","労務管理や勤怠確認に手作業が残っている可能性がある","人材データを活用した意思決定に課題がある可能性がある"],hypos:[["採用から定着までの情報整理","採用活動と入社後フォローの情報が分かれ、改善点を把握しにくいことがある。","候補者情報、育成状況、定着データをつなげて確認できる仕組みを検討する。","採用後のオンボーディングや定着状況はどのように確認していますか。"],["評価・育成プロセスの標準化","評価や育成は現場マネージャーの運用に依存しやすい。","面談記録、目標管理、評価フローを整理し、運用の透明性を高める。","評価や面談で部署ごとの差を感じる場面はありますか。"],["労務管理の手作業削減","勤怠、申請、労務確認に手作業が残ると確認漏れや負荷につながりやすい。","申請・承認・記録の流れを確認し、効率化と内部統制強化を提案する。","労務関連で負荷が集中する作業はありますか。"]]},
      acct:{keys:["経理","財務","会計","経営管理"],label:"経理・財務部門",issues:["月次決算や請求処理で締め日前後に負荷が集中している可能性がある","承認フローや証憑管理に手作業が残っている可能性がある","データ転記や照合作業により確認工数が発生している可能性がある","内部統制と業務効率化を同時に進める必要がある可能性がある"],hypos:[["月次決算の早期化","締め処理や確認作業が集中し、月次決算の早期化が課題になりやすい。","請求、支払、仕訳、承認の流れを整理し、ボトルネックを特定する。","月次決算で最も時間がかかる工程はどこですか。"],["承認フローの見える化","紙やメール中心の承認では、進捗確認や証跡管理が難しくなることがある。","承認経路、滞留箇所、証跡の残し方を確認し、統制と効率化を両立する。","承認待ちや差し戻しはどのように把握していますか。"],["転記・照合作業の削減","複数システム間の転記は、確認工数とミスの発生源になりやすい。","連携状況を確認し、入力・照合・確認作業の削減余地を探る。","同じ情報を複数箇所に入力している業務はありますか。"]]},
      sales:{keys:["営業","セールス","sales","事業開発"],label:"営業部門",issues:["案件管理や商談履歴の入力品質にばらつきがある可能性がある","見込み顧客の優先順位づけやフォロー漏れが課題になっている可能性がある","営業活動の可視化や報告に工数がかかっている可能性がある","商談品質や提案内容が担当者ごとに属人化している可能性がある"],hypos:[["案件管理の精度向上","案件情報の入力粒度が揃わないと、見込み精度や次アクションの判断が難しくなる。","案件ステージ、活動履歴、失注理由を確認し、入力負荷を抑えた可視化を提案する。","案件情報で確認しにくい項目はありますか。"],["フォロー漏れの防止","見込み顧客が増えるほど、適切なタイミングでの再接触が難しくなる。","顧客状態や次回アクションを整理し、フォロー計画の標準化余地を確認する。","商談後のフォローはどのように管理していますか。"],["商談品質の標準化","ヒアリング項目や提案観点が担当者に依存すると、レビュー品質に差が出やすい。","商談準備、ヒアリング、提案レビューの型を整え、再現性を高める。","初回商談で必ず確認している項目はありますか。"]]}
    };
    const fallback={label:"一般部門",issues:["定型業務に時間がかかり、改善活動に十分な時間を確保しにくい可能性がある","情報共有が分散し、意思決定までに時間がかかっている可能性がある","業務手順や判断基準が属人化している可能性がある","コスト管理や進捗把握に必要な情報が見える化されていない可能性がある"],hypos:[["定型業務の見直し","日々の定型業務が積み重なり、改善や分析に使える時間が限られやすい。","業務の流れ、使用ツール、確認回数を整理し、効率化領域を特定する。","時間がかかっている定型業務はありますか。"],["情報共有のスピード向上","情報が複数のツールや担当者に分散すると、判断の遅れにつながりやすい。","共有すべき情報、関係者、確認頻度を整理し、見える化と連携改善を提案する。","必要な情報を探すとき、どこを確認することが多いですか。"],["属人化の解消","特定担当者に業務知識が集中すると、品質維持や引き継ぎにリスクが出やすい。","業務手順、判断基準、例外対応を整理し、チームで共有できる形にする。","特定の人にしか分からない業務はありますか。"]]};
    const questions=["現在の業務フローで、最も時間がかかっている工程はどこですか。","直近で困っていることや、改善したい業務はありますか。","現在利用しているツールや既存ベンダーの満足点と課題は何ですか。","新しいサービスを検討する際、重視する判断基準は何ですか。","導入を検討する場合、いつ頃までに方向性を決めたいですか。","検討や決裁に関わる方は、どの部署・役職の方ですか。"]; 
    const checks=["企業概要が整理されている","相手部署の想定課題が整理されている","提案仮説が3つ以上ある","商談で確認する質問がある","次のアクションが分かる"];
    const actions=["企業Webサイトで事業内容と主要サービスを確認する","担当者部署の役割と今回の商談目的を追加確認する","上司にレポートを共有してレビューを依頼する","商談時に必ず確認したい質問を3つ選ぶ"];
    const $=s=>document.querySelector(s), esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    const list=a=>`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
    const tmpl=dept=>Object.values(data).find(t=>t.keys.some(k=>dept.toLowerCase().includes(k.toLowerCase())))||fallback;
    const date=()=>new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric"}).format(new Date());
    let lastText="";
    function validate(v){let ok=true;Object.entries(v).forEach(([k,val])=>{const f=document.querySelector(`[data-field="${k}"]`);const bad=!val.trim();f.classList.toggle("invalid",bad);if(bad)ok=false});return ok}
    function text(r){return ["営業訪問前レポート","","【基本情報】",`お客様企業名: ${r.company}`,`担当者名: ${r.contact}`,`担当者の部署名: ${r.dept}`,`レポート作成日: ${r.day}`,"","【企業概要】",...r.overview.map(x=>`- ${x}`),"",`【想定課題（${r.t.label}）】`,...r.t.issues.map(x=>`- ${x}`),"","【提案仮説】",...r.t.hypos.map((h,i)=>`${i+1}. ${h[0]}\n背景: ${h[1]}\n提案の方向性: ${h[2]}\n商談で確認すべき質問: ${h[3]}`),"","【商談で確認すべき質問】",...questions.map(x=>`- ${x}`),"","【上司レビュー用チェック項目】",...checks.map(x=>`- [ ] ${x}`),"","【次のアクション】",...actions.map(x=>`- ${x}`)].join("\n")}
    function render(r){lastText=text(r);$("#empty").hidden=true;$("#report").hidden=false;$("#report").innerHTML=`<div class="report-head"><div><p class="eyebrow">営業訪問前レポート</p><h2 class="report-title">${esc(r.company)}</h2><p class="muted">${esc(r.dept)} / ${esc(r.contact)} 様</p></div><div class="no-print"><button class="btn secondary" id="copy" type="button">レポートをコピー</button><div class="status" id="status"></div></div></div><section class="section"><h3>基本情報</h3><dl class="info"><div><dt>お客様企業名</dt><dd>${esc(r.company)}</dd></div><div><dt>担当者名</dt><dd>${esc(r.contact)}</dd></div><div><dt>担当者の部署名</dt><dd>${esc(r.dept)}</dd></div><div><dt>レポート作成日</dt><dd>${esc(r.day)}</dd></div></dl></section><section class="section"><h3>企業概要</h3>${list(r.overview)}</section><section class="section"><h3>想定課題（${esc(r.t.label)}）</h3>${list(r.t.issues)}</section><section class="section"><h3>提案仮説</h3><div class="hypotheses">${r.t.hypos.map((h,i)=>`<div class="hypothesis"><h4><span class="num">${i+1}</span>${esc(h[0])}</h4><dl><dt>背景</dt><dd>${esc(h[1])}</dd><dt>提案の方向性</dt><dd>${esc(h[2])}</dd><dt>商談で確認すべき質問</dt><dd>${esc(h[3])}</dd></dl></div>`).join("")}</div></section><section class="section"><h3>商談で確認すべき質問</h3>${list(questions)}</section><section class="section"><h3>上司レビュー用チェック項目</h3><ul class="check">${checks.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section><section class="section"><h3>次のアクション</h3>${list(actions)}</section>`;$("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(lastText);$("#status").textContent="コピーしました";setTimeout(()=>$("#status").textContent="",2000)}catch{$("#status").textContent="コピーに失敗しました"}}}
    $("#form").onsubmit=e=>{e.preventDefault();const v={company:$("#company").value.trim(),contact:$("#contact").value.trim(),dept:$("#dept").value.trim()};if(!validate(v))return;const t=tmpl(v.dept);render({...v,t,day:date(),overview:[`${v.company}は、顧客や取引先に継続的に価値提供を行う事業会社であると想定する。実データ検索は行っていないため、初回訪問前の仮説として整理する。`,"想定される顧客・市場は、主要サービスや営業エリア、公開情報を確認したうえで具体化する必要がある。","組織面では、部門間の情報共有、業務効率化、既存ツールの活用状況に改善余地がある可能性がある。","初回訪問では、事業内容、主要顧客、現在の重点施策、今回の相談背景を確認する。"]})};
    $("#reset").onclick=()=>{$("#form").reset();document.querySelectorAll(".field").forEach(f=>f.classList.remove("invalid"));$("#report").hidden=true;$("#report").innerHTML="";$("#empty").hidden=false;lastText=""};
  </script>
</body>
</html>
